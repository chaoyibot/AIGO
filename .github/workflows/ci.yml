name: CI Build & Test
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aigo
          POSTGRES_PASSWORD: aigo
          POSTGRES_DB: aigo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U aigo
          --health-interval 3s
          --health-timeout 3s
          --health-retries 5          
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go mod download
      - run: go run ./cmd/migrate
        env:
          DATABASE_URL: postgres://aigo:aigo@localhost:5432/aigo?sslmode=disable
      - run: go build -o bin/aigo ./cmd/server
      - run: go vet ./...
      - run: go test ./... -v -count=1
        env:
          DATABASE_URL: postgres://aigo:aigo@localhost:5432/aigo?sslmode=disable
