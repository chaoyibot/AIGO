name: CI Build & Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aigo
          POSTGRES_PASSWORD: aigo
          POSTGRES_DB: aigo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U aigo
          --health-interval 3s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Run Database Migration
        run: go run ./cmd/migrate
        env:
          DATABASE_URL: postgres://aigo:***@localhost:5432/aigo?sslmode=disable

      - name: Build
        run: go build -o bin/aigo ./cmd/server

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1
        env:
          DATABASE_URL: postgres://aigo:***@localhost:5432/aigo?sslmode=disable
