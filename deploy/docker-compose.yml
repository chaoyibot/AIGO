services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aigo
      POSTGRES_PASSWORD: aigo
      POSTGRES_DB: aigo
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigo"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  nats:
    image: nats:2-alpine
    command: ["-js"]
    ports: ["4222:4222"]

volumes:
  pgdata:
